---
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name:  te2004b_reto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped

  nodered:
    build:
      context: ./nodered
    image: robot-nodered-dashboard:latest
    container_name: robot-nodered
    environment:
      - FLOWS=flows.json
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped
